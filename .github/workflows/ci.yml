name: Verify generator
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate, compile, test, boot and verify database adapters
        run: python scripts/verify_generator.py --database-it
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            target/verification-*/*.log
            target/verification-*/summary.json
            target/verification-*/service-*/target/surefire-reports/
            target/verification-*/service-*/target/failsafe-reports/
